[package]
name = "gmail"
version = "0.5.1"
description = "Gmail tools (list_recent / read_body / fetch_attachment / send / modify_labels / watch) authenticated through the runtime's stored OAuth credential (oauth.token) — pure Katari, no sidecar."

[runtime]
url = "http://localhost:3000"

[dependencies]
registry = "https://raw.githubusercontent.com/katari-lang/katari-registry/main"
snapshot = "staging"
packages = ["google_common"]

